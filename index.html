<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081a29">
<meta name="description" content="驾驶红帆小船，探索由厚涂油彩搭成的立体星海。">
<title>星海漫游 · Star Sea Voyage</title>
<link rel="stylesheet" href="style.css">
<script defer src="three.min.js"></script>
<script defer src="patch-oilpaint.js"></script>
<script defer src="world.js"></script>
<script defer src="game.js"></script>
<script defer src="interface.js"></script>
</head>
<body>
<main id="stage" tabindex="-1" aria-label="星海漫游 3D 场景"></main>
<button type="button" id="show-help" class="help" hidden>操作说明</button>
<dialog id="welcome" aria-labelledby="game-title">
  <section class="intro">
    <p class="subtitle" lang="en">Star Sea Voyage</p>
    <h1 id="game-title">星海漫游</h1>
    <p class="description">驾一艘红帆船，驶进梵高风格的油画星空。</p>
    <button type="button" id="start" class="start" disabled>开始航行</button>
    <p id="load-message" role="status">正在载入星海…</p>
    <dl class="controls">
      <div><dt>电脑</dt><dd>WASD 或方向键航行，拖动鼠标转动视角。</dd></div>
      <div><dt>触屏</dt><dd>拖动左半屏航行，拖动右半屏转动视角。</dd></div>
    </dl>
    <noscript>请启用 JavaScript 后重新加载，以进入游戏。</noscript>
  </section>
</dialog>
</body>
</html>
